<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Rider profile</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="riders"
      page-title="Rider profile"
      breadcrumb="Riders|riders.html > Profile"
      screen-styles="styles/detail.css, styles/list.css"
    >
      <div id="profile-missing" hidden>
        <ad-empty-state icon="⚠" heading="Rider not found" message="This rider account does not exist.">
          <a class="btn btn--secondary btn--sm" href="riders.html">Back to riders</a>
        </ad-empty-state>
      </div>

      <div id="profile-body" hidden>
        <div class="ad-split">
          <div class="ad-stack">
            <ad-detail-section id="personal" section-title="Rider details"></ad-detail-section>

            <!-- #1662 S6 — trip history, 10 rows/page, read-only -->
            <section class="ad-section" aria-labelledby="trips-heading">
              <div class="ad-section__header">
                <div>
                  <h2 class="ad-section__title" id="trips-heading">Trip history</h2>
                  <p class="ad-section__hint">
                    Read-only. Trip rows are deliberately not clickable in this phase.
                  </p>
                </div>
              </div>
              <ad-data-table id="trips-table"></ad-data-table>
            </section>
          </div>

          <aside class="ad-split__aside">
            <ad-detail-section id="status-card" section-title="Account status"></ad-detail-section>

            <section class="ad-section" aria-labelledby="actions-heading">
              <div class="ad-section__header">
                <h2 class="ad-section__title" id="actions-heading">Account actions</h2>
              </div>
              <div class="ad-section__body ad-stack">
                <p class="ad-section__hint" id="action-hint"></p>
                <button class="btn btn--danger btn--full" type="button" id="suspend-btn" hidden>
                  Suspend rider
                </button>
                <button class="btn btn--primary btn--full" type="button" id="reinstate-btn" hidden>
                  Reinstate rider
                </button>
              </div>
            </section>
          </aside>
        </div>
      </div>

      <ad-form-modal id="action-modal"></ad-form-modal>
    </ad-shell>

    <script type="module" src="scripts/rider-profile.js"></script>
  </body>
</html>
