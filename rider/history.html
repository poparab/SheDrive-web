<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SheDrive — رحلاتي" />
    <title>SheDrive — رحلاتي</title>
    <script type="module" src="../shared/components/sd-page.js"></script>
  </head>

  <body class="app-shell history-page">
    <sd-page
      body-class="app-shell history-page"
      screen-styles="styles/rider.css, styles/history.css"
    >
      <!-- ── Purple hero band holding the header (Figma "Trip History") ── -->
      <div class="sd-hero history-hero">
        <sd-app-header
          bar-class="history-topbar"
          inner-class="history-topbar__inner"
          title-class="history-topbar__title"
        >
          <sd-button
            data-slot="start"
            type="button"
            variant="ghost"
            icon
            id="back-btn"
            data-i18n-aria-label="aria.back"
            aria-label="رجوع"
            data-back="./home.html"
          >
            <svg class="history-topbar__back-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </sd-button>

          <svg class="history-topbar__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <h1 class="history-topbar__title-text" data-i18n="history.title">رحلاتي</h1>
        </sd-app-header>
      </div>

      <main class="sd-panel history-content" aria-label="قائمة الرحلات" data-i18n-aria-label="aria.history">

        <!-- ── Trip list (default state) — populated by scripts/history.js, paginated on scroll (#1567) ─── -->
        <section class="history-list state--has-trips" aria-label="الرحلات السابقة" data-i18n-aria-label="aria.history">

          <div id="history-list-items" class="history-list__items" role="list"></div>

          <!-- Skeleton cards (loading state — hidden by default) -->
          <div class="history-skeleton state--loading" aria-busy="true" aria-label="جارٍ التحميل" data-i18n-aria-label="history.loading">
            <div class="skeleton-card">
              <div class="skeleton skeleton--sm"></div>
              <div class="skeleton skeleton--lg"></div>
              <div class="skeleton skeleton--md"></div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton skeleton--sm"></div>
              <div class="skeleton skeleton--lg"></div>
              <div class="skeleton skeleton--md"></div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton skeleton--sm"></div>
              <div class="skeleton skeleton--lg"></div>
              <div class="skeleton skeleton--md"></div>
            </div>
          </div>
        </section>

        <!-- ── Empty state (state=empty) ─────────────── -->
        <section class="history-empty state--empty" aria-labelledby="history-empty-title">
          <div class="history-empty__icon" aria-hidden="true">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
              <circle cx="7" cy="17" r="2"></circle>
              <path d="M9 17h6"></path>
              <circle cx="17" cy="17" r="2"></circle>
            </svg>
          </div>
          <h2 class="history-empty__title" id="history-empty-title" data-i18n="history.empty">لا توجد رحلات بعد</h2>
          <p class="history-empty__body" data-i18n="history.emptyBody">احجزي رحلتكِ الأولى وستظهر رحلاتكِ المكتملة هنا.</p>
          <a href="home.html" class="btn btn--primary btn--full history-empty__cta" data-i18n="history.bookRide">
            احجزي رحلة
          </a>
        </section>

      </main>
    </sd-page>

    <script type="module" src="scripts/history.js"></script>

    <!-- Demo only: ?state=empty | loading -->
    <script type="module">
      const s = new URLSearchParams(location.search).get('state');
      if (s) document.body.dataset.state = s;
    </script>
  </body>
</html>
