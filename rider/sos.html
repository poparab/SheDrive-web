<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive — جهات اتصال الطوارئ</title>
    <script type="module" src="../shared/components/sd-page.js"></script>
  </head>
  <body>
    <sd-page body-class="app-shell rider-sos-page" screen-styles="styles/rider.css, styles/sos.css">

      <!-- Figma "Safety & Emergency": purple hero band + white panel -->
      <div class="sd-hero sos-hero">
        <sd-app-header hide-lang-toggle title-class="sos-hero__title">
          <a href="./home.html" class="btn btn--icon btn--ghost" data-back data-slot="start"
            aria-label="رجوع" data-i18n-aria-label="aria.back">
            <svg class="sos-back-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 5 12 12 19"/>
            </svg>
          </a>
          <svg class="sos-hero__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
          <span data-i18n="sos.title">جهات اتصال الطوارئ</span>
          <span class="sos-hero__spacer" data-slot="end" aria-hidden="true"></span>
        </sd-app-header>
      </div>

      <main class="sd-panel rider-sos-main" role="main">
        <section class="sos-contacts" id="sos-contacts-root" aria-label="جهات اتصال الطوارئ" data-i18n-aria-label="sos.title"></section>
      </main>

    </sd-page>
    <script type="module" src="scripts/sos.js"></script>
  </body>
</html>
