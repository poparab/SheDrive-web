<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SheDrive — المحادثة مع الراكبة" />
    <title>SheDrive — المحادثة</title>
    <script type="module" src="../shared/components/sd-page.js"></script>
  </head>
  <body class="app-shell chat-page">
    <sd-page body-class="app-shell chat-page" screen-styles="styles/driver.css, ../shared/styles/trip-chat.css, styles/chat.css">
      <!-- ── Purple hero band: who she is talking to ── -->
      <div class="sd-hero chat-hero">
        <sd-app-header bar-class="chat-topbar" inner-class="chat-topbar__inner" title-class="chat-topbar__title">
          <sd-button data-slot="start" type="button" variant="ghost" icon id="back-btn" data-i18n-aria-label="aria.back" aria-label="رجوع" data-back="./trip.html">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </sd-button>
          <div class="chat-peer">
            <span class="chat-peer__avatar" id="chat-peer-avatar" aria-hidden="true">ن</span>
            <span class="chat-peer__text">
              <h1 class="chat-peer__name" id="chat-peer-name">نور</h1>
              <span class="chat-peer__role" data-i18n="chat.peer.rider">راكبتك</span>
            </span>
          </div>
        </sd-app-header>
      </div>

      <main class="sd-panel chat-panel fill-screen" aria-labelledby="chat-peer-name">
        <p class="chat-notice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span data-i18n="chat.notice">الرسائل لهذه الرحلة فقط، وتُخفى أرقام الهواتف.</span>
        </p>

        <!-- ── Empty state ── -->
        <div class="chat-empty" id="chat-empty" hidden>
          <span class="chat-empty__icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </span>
          <p class="chat-empty__title" data-i18n="chat.empty.title">لا توجد رسائل بعد</p>
          <p class="chat-empty__hint" data-i18n="chat.empty.hint.driver">اختاري ردًا سريعًا أو اكتبي رسالة إلى الراكبة.</p>
        </div>

        <!-- ── The conversation ── -->
        <ol class="chat-thread" id="chat-thread" role="log" aria-live="polite" data-i18n-aria-label="chat.threadAria" aria-label="الرسائل"></ol>

        <!-- ── Quick replies + composer, pinned at the bottom ── -->
        <div class="action-dock chat-dock">
          <p class="chat-closed" role="status">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span data-i18n="chat.closed">انتهت الرحلة، لذلك أُغلقت المحادثة.</span>
          </p>

          <!-- In-ride: quick replies only, so she never types while driving -->
          <p class="chat-driving">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="3" x2="12" y2="10"/><line x1="4.5" y1="15" x2="10.3" y2="12.8"/><line x1="19.5" y1="15" x2="13.7" y2="12.8"/></svg>
            <span data-i18n="chat.drivingNote">أثناء القيادة يمكنكِ إرسال الردود السريعة فقط.</span>
          </p>

          <div class="chat-quick" id="chat-quick" role="group" data-i18n-aria-label="chat.quickAria" aria-label="ردود سريعة"></div>

          <form class="chat-composer" id="chat-composer" novalidate>
            <label class="u-visually-hidden" for="chat-input" data-i18n="chat.inputLabel">رسالتك</label>
            <textarea class="input chat-input" id="chat-input" rows="1" maxlength="300" data-i18n-placeholder="chat.placeholder.driver" placeholder="اكتبي رسالة إلى الراكبة"></textarea>
            <button type="submit" class="btn btn--primary btn--icon chat-send" id="chat-send" data-i18n-aria-label="chat.send" aria-label="إرسال" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </form>
          <p class="chat-count" id="chat-count" aria-live="polite" hidden>0/300</p>
        </div>
      </main>
    </sd-page>

    <script type="module" src="scripts/chat.js"></script>
  </body>
</html>
