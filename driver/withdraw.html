<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SheDrive — طلب سحب الرصيد" />
    <title>SheDrive Driver — طلب سحب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../shared/styles/reset.css" />
    <link rel="stylesheet" href="../shared/styles/base.css" />
    <link rel="stylesheet" href="../shared/styles/components.css" />
    <link rel="stylesheet" href="../shared/styles/utilities.css" />
    <link rel="stylesheet" href="../shared/styles/f7-overrides.css" />
    <link rel="stylesheet" href="../shared/styles/web-components.css" />
    <link rel="stylesheet" href="../shared/styles/rtl.css" />
    <link rel="stylesheet" href="styles/driver.css" />
    <link rel="stylesheet" href="styles/withdraw.css" />

    <script type="module" src="../shared/components/sd-page.js"></script>
  </head>

  <body class="app-shell withdraw-page">
    <sd-page body-class="app-shell withdraw-page" screen-styles="styles/driver.css, styles/withdraw.css">

      <sd-app-header>
        <a href="./balance.html" class="btn btn--icon btn--ghost" data-slot="start" data-i18n-aria-label="aria.back" aria-label="رجوع">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </a>
        <span data-i18n="driver.withdraw.title">طلب سحب</span>
      </sd-app-header>

      <main class="withdraw-main">

        <!-- ── Error state ── -->
        <div class="withdraw-error" id="withdraw-error-state" hidden aria-hidden="true">
          <p class="withdraw-error__msg" data-i18n="driver.withdraw.loadError">تعذّر تحميل بيانات السحب. تحقّقي من اتصالك.</p>
          <button type="button" class="btn btn--ghost" id="withdraw-retry" data-i18n="driver.withdraw.retry">إعادة المحاولة</button>
        </div>

        <div id="withdraw-content">

        <!-- ── Available to withdraw ── -->
        <div class="withdraw-available" id="withdraw-available">
          <p class="withdraw-available__label" data-i18n="driver.withdraw.available">المتاح للسحب</p>
          <p class="withdraw-available__amount">
            <span id="available-amount">0</span>
            <span class="withdraw-available__currency" data-i18n="driver.currency">جنيه</span>
          </p>
        </div>

        <!-- ── Blocked state: disabled / no balance / cooling-off (#TBD-D S5–S7) ── -->
        <div class="withdraw-blocked" id="withdraw-blocked" hidden aria-hidden="true" role="status">
          <p class="withdraw-blocked__msg" id="withdraw-blocked-msg"></p>
        </div>

        <!-- ── Request form ── -->
        <form class="withdraw-form" id="withdraw-form" novalidate>
          <div class="field">
            <label class="field__label" for="withdraw-amount" data-i18n="driver.withdraw.amountLabel">المبلغ</label>
            <input
              class="input"
              id="withdraw-amount"
              name="amount"
              type="number"
              inputmode="decimal"
              step="0.01"
              min="0"
              autocomplete="off"
              data-i18n-placeholder="driver.withdraw.amountPlaceholder"
              placeholder="٠"
              aria-describedby="withdraw-limits withdraw-error"
            />
            <p class="withdraw-form__limits" id="withdraw-limits"></p>
            <p class="withdraw-form__error" id="withdraw-error" role="alert" hidden aria-hidden="true"></p>
          </div>

          <button type="submit" class="btn btn--primary btn--full" id="withdraw-submit" data-i18n="driver.withdraw.submit">إرسال الطلب</button>
        </form>

        <!-- ── Request history (#TBD-D S8) ── -->
        <section class="withdraw-history" data-i18n-aria-label="driver.withdraw.historyAria" aria-label="سجل طلبات السحب">
          <h2 class="withdraw-history__title" data-i18n="driver.withdraw.history">طلباتك</h2>
          <div id="withdraw-list"><!-- rendered by JS --></div>
          <p class="withdraw-history__empty" id="withdraw-empty" hidden aria-hidden="true" data-i18n="driver.withdraw.historyEmpty">لا توجد طلبات سحب بعد.</p>
        </section>

        </div>

      </main>

      <script type="module" src="scripts/withdraw.js"></script>
    </sd-page>
  </body>
</html>
