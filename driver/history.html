<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SheDrive Driver — سجل الرحلات" />
    <title>SheDrive Driver — سجل الرحلات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../shared/styles/reset.css" />
    <link rel="stylesheet" href="../shared/styles/base.css" />
    <link rel="stylesheet" href="../shared/styles/components.css" />
    <link rel="stylesheet" href="../shared/styles/utilities.css" />
    <link rel="stylesheet" href="../shared/styles/f7-overrides.css" />
    <link rel="stylesheet" href="../shared/styles/web-components.css" />
    <link rel="stylesheet" href="../shared/styles/rtl.css" />
    <link rel="stylesheet" href="styles/driver.css" />
    <link rel="stylesheet" href="styles/history.css" />

    <script type="module" src="../shared/components/sd-page.js"></script>
  </head>

  <body class="app-shell driver-history-page">
    <sd-page body-class="app-shell driver-history-page" screen-styles="styles/driver.css, styles/history.css">

      <!-- ── Hero header ── -->
      <div class="sd-hero dhistory-hero">
        <sd-app-header hide-lang-toggle>
          <a href="./home.html" class="btn btn--icon btn--ghost" data-slot="start" data-i18n-aria-label="aria.back" aria-label="رجوع">
            <svg class="dhistory-back__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"/>
              <polyline points="12 19 5 12 12 5"/>
            </svg>
          </a>
          <span class="sd-hero__title dhistory-hero__title">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="dhistory-hero__text" data-i18n="driver.history.title">سجل الرحلات</span>
          </span>
          <!-- Keeps the title centred opposite the back button -->
          <span class="dhistory-hero__spacer" data-slot="end" aria-hidden="true"></span>
        </sd-app-header>
      </div>

      <!-- ── Content ── -->
      <main class="sd-panel dhistory-content" aria-label="سجل رحلات السائقة" data-i18n-aria-label="aria.driver.history">

        <!-- ── Trip list (default) — rows rendered by scripts/history.js ── -->
        <section class="dhistory-list state--has-trips" id="dhistory-list" aria-label="سجل الرحلات" data-i18n-aria-label="driver.history.title"></section>

        <!-- ── Skeleton cards (?state=loading) ── -->
        <div class="dhistory-skeleton state--loading" aria-busy="true" role="status" aria-label="جارٍ التحميل" data-i18n-aria-label="driver.history.loading">
            <div class="skeleton-card">
              <div class="skeleton skeleton--sm"></div>
              <div class="skeleton skeleton--lg"></div>
              <div class="skeleton skeleton--md"></div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton skeleton--sm"></div>
              <div class="skeleton skeleton--lg"></div>
              <div class="skeleton skeleton--md"></div>
            </div>
            <div class="skeleton-card">
              <div class="skeleton skeleton--sm"></div>
              <div class="skeleton skeleton--lg"></div>
              <div class="skeleton skeleton--md"></div>
            </div>
        </div>

        <!-- ── Empty state (?state=empty) ── -->
        <section class="dhistory-empty state--empty" aria-labelledby="dhistory-empty-title">
          <span class="icon-tile icon-tile--xl icon-tile--round dhistory-empty__icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </span>
          <h2 class="dhistory-empty__title" id="dhistory-empty-title" data-i18n="driver.history.empty">لا توجد رحلات بعد</h2>
          <p class="dhistory-empty__body" data-i18n="driver.history.emptyBody">ابدئي رحلتك الأولى</p>
          <a href="./home.html" class="btn btn--primary btn--full dhistory-empty__cta" data-i18n="driver.history.goHome">اذهبي للرئيسية</a>
        </section>

      </main>

      <script type="module" src="scripts/history.js"></script>
    </sd-page>
  </body>
</html>
