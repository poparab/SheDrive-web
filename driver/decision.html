<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SheDrive Driver — نتيجة طلب الانضمام" />
    <title>SheDrive Driver — نتيجة الطلب</title>

    <link rel="stylesheet" href="../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../shared/styles/reset.css" />
    <link rel="stylesheet" href="../shared/styles/base.css" />
    <link rel="stylesheet" href="../shared/styles/components.css" />
    <link rel="stylesheet" href="../shared/styles/utilities.css" />
    <link rel="stylesheet" href="../shared/styles/f7-overrides.css" />
    <link rel="stylesheet" href="../shared/styles/web-components.css" />
    <link rel="stylesheet" href="../shared/styles/rtl.css" />
    <link rel="stylesheet" href="styles/driver.css" />
    <link rel="stylesheet" href="styles/decision.css" />

    <script type="module" src="../shared/components/sd-page.js"></script>
  </head>

  <body class="app-shell driver-decision-page">
    <sd-page body-class="app-shell driver-decision-page" screen-styles="styles/driver.css, styles/decision.css">

      <!-- Push banner — simulates the approved/rejected push notification (#1577) -->
      <div class="push-banner" id="decision-push-banner" hidden role="alert" aria-live="assertive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="push-banner-text" data-i18n="driver.decision.approved.title">تمت الموافقة على طلبكِ!</span>
      </div>

      <main class="decision-layout" aria-label="نتيجة طلب الانضمام" data-i18n-aria-label="aria.driver.decision">

        <!-- ── Approved state (default) — Figma "Driver - Account Approved" ── -->
        <section class="decision-card state--approved">
          <div class="decision-card__main">
            <div class="decision-icon decision-icon--success" aria-hidden="true">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
            </div>

            <div class="decision-text">
              <h1 class="decision-title" data-i18n="driver.decision.approved.title">تمت الموافقة على طلبكِ!</h1>
              <p class="decision-body" data-i18n="driver.decision.approved.body">
                مرحباً بكِ في SheDrive. أنتِ الآن جاهزة للعمل.
              </p>
            </div>

            <div class="decision-badges" role="group" aria-label="مزايا SheDrive" data-i18n-aria-label="aria.driver.decisionBadges">
              <span class="decision-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                <span data-i18n="trip.badge.verified">سائقة موثقة</span>
              </span>
            </div>
          </div>

          <div class="decision-actions">
            <button
              type="button"
              class="btn btn--primary btn--full"
              id="start-btn"
              data-i18n="driver.decision.start"
            >
              ابدئي العمل
            </button>
          </div>
        </section>

        <!-- ── Rejected state — Figma "Driver - Account Rejected" ── -->
        <section class="decision-card state--rejected">
          <div class="decision-card__main">
            <div class="decision-icon decision-icon--warning" aria-hidden="true">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>

            <div class="decision-text">
              <h1 class="decision-title decision-title--warning" data-i18n="driver.decision.rejected.title">لم نتمكن من قبول طلبكِ</h1>
              <p class="decision-body" data-i18n="driver.decision.rejected.reasonIntro">
                للأسف لم نتمكن من قبول طلبكِ في الوقت الحالي. السبب:
              </p>
            </div>

            <!-- Admin rejection reason displayed here -->
            <div class="decision-rejection-reason" id="decision-rejection-card">
              <span class="icon-tile" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
              </span>
              <p class="decision-rejection-reason__text" id="decision-rejection-text" data-i18n="driver.decision.rejected.reasonPlaceholder">
                المستند المرفوع غير واضح — يرجى إعادة رفع رخصة القيادة
              </p>
              <span class="decision-rejection-reason__flag" aria-hidden="true">!</span>
            </div>

            <p class="callout decision-rejection-note">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <span data-i18n="driver.decision.rejected.body">يُرجى التواصل مع فريق الدعم لمزيد من التفاصيل.</span>
            </p>
          </div>

          <div class="decision-actions">
            <button
              type="button"
              class="btn btn--primary btn--full"
              id="contact-btn"
              data-i18n="driver.decision.contact"
            >
              تواصل مع الدعم
            </button>
          </div>
        </section>

      </main>

      <script type="module" src="scripts/decision.js"></script>

      <!-- Demo only: ?state=approved | rejected (&reason=…). Set before first paint;
           the push banner is handled in decision.js. -->
      <script type="module">
        const s = new URLSearchParams(location.search).get('state');
        document.body.dataset.state = s === 'rejected' ? 'rejected' : 'approved';
      </script>
    </sd-page>
  </body>
</html>
