<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SheDrive — الإشعارات" />
    <title>SheDrive Driver — الإشعارات</title>
    <script type="module" src="../shared/components/sd-page.js"></script>
  </head>
  <body class="app-shell notifications-page">
    <sd-page body-class="app-shell notifications-page" screen-styles="styles/driver.css, ../shared/styles/notifications.css, styles/notifications.css">
      <!-- ── Purple hero band holding the header (same language as the Figma list screens) ── -->
      <div class="sd-hero notif-hero">
        <sd-app-header bar-class="notif-topbar" inner-class="notif-topbar__inner" title-class="notif-topbar__title">
          <sd-button data-slot="start" type="button" variant="ghost" icon id="back-btn" data-i18n-aria-label="aria.back" aria-label="رجوع" data-back="./home.html">
            <svg class="notif-topbar__back-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </sd-button>
          <h1 class="notif-topbar__title-text" data-i18n="notifications.title">الإشعارات</h1>
        </sd-app-header>
      </div>

      <main class="sd-panel notif-content" id="main-content" data-i18n-aria-label="notifications.title" aria-label="الإشعارات">

        <!-- ── Error state (?state=error) ───────────────────────── -->
        <div class="notif-error" id="notif-error" hidden aria-hidden="true">
          <div class="notif-error__icon" aria-hidden="true">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </div>
          <h2 class="notif-error__title" data-i18n="common.error">حدث خطأ ما</h2>
          <p class="notif-error__msg" data-i18n="notifications.error">تعذّر تحميل الإشعارات. تحقّقي من اتصالك.</p>
          <button type="button" class="btn btn--primary btn--full" id="notif-retry" data-i18n="common.retry">حاولي مجدداً</button>
        </div>

        <!-- ── Loading state (?state=loading) ───────────────────── -->
        <div class="notif-loading" id="notif-loading" hidden aria-hidden="true" role="status" data-i18n-aria-label="notifications.loading" aria-label="جارٍ تحميل الإشعارات">
          <div class="notif-skeleton"><span class="notif-skeleton__dot"></span><span class="notif-skeleton__lines"><span class="notif-skeleton__line"></span><span class="notif-skeleton__line"></span><span class="notif-skeleton__line notif-skeleton__line--short"></span></span></div>
          <div class="notif-skeleton"><span class="notif-skeleton__dot"></span><span class="notif-skeleton__lines"><span class="notif-skeleton__line"></span><span class="notif-skeleton__line"></span><span class="notif-skeleton__line notif-skeleton__line--short"></span></span></div>
          <div class="notif-skeleton"><span class="notif-skeleton__dot"></span><span class="notif-skeleton__lines"><span class="notif-skeleton__line"></span><span class="notif-skeleton__line"></span><span class="notif-skeleton__line notif-skeleton__line--short"></span></span></div>
        </div>

        <div id="notif-body" class="notif-content__body">


          <!-- ── Filter + mark all ────────────────────────────────── -->
          <div class="notif-toolbar" role="group" data-i18n-aria-label="notifications.filter.label" aria-label="تصفية الإشعارات">
            <button type="button" class="notif-filter is-active" data-notif-filter="all" aria-pressed="true">
              <span data-i18n="notifications.filter.all">الكل</span>
            </button>
            <button type="button" class="notif-filter" data-notif-filter="unread" aria-pressed="false">
              <span data-i18n="notifications.filter.unread">غير المقروءة</span>
              <span class="notif-filter__count" id="notif-unread-count" hidden></span>
            </button>
            <button type="button" class="btn btn--ghost btn--sm notif-mark-all" id="notif-mark-all" data-i18n="notifications.markAllRead">تحديد الكل كمقروء</button>
          </div>

          <!-- ── Empty state (?state=empty, or Unread with nothing unread) ── -->
          <div class="notif-empty" id="notif-empty" hidden aria-hidden="true">
            <div class="notif-empty__icon" aria-hidden="true">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <p class="notif-empty__title" id="notif-empty-title" data-i18n="notifications.empty.title">لا توجد إشعارات بعد</p>
            <p class="notif-empty__hint" id="notif-empty-hint" data-i18n="notifications.empty.hint.driver">ستظهر هنا تحديثات أرباحكِ ومستنداتكِ وإعلانات شي درايف.</p>
          </div>

          <!-- ── The feed, grouped Today / Yesterday / Earlier ────── -->
          <div class="notif-list" id="notif-list"></div>
        </div>
      </main>
    </sd-page>

    <script type="module" src="scripts/notifications.js"></script>
  </body>
</html>
