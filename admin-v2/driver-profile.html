<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Driver profile</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="drivers"
      page-title-key="driverProfile.title"
      breadcrumb-keys="nav.drivers|drivers.html > driverProfile.crumb"
      back="drivers.html"
      screen-styles="styles/detail.css, styles/list.css, styles/driver-profile.css"
    >
      <!-- Kit model: driver-profile.html / driver-unsuspend.html (v22-09) -->
      <!-- The record's standing state (ad-banner) -->
      <ad-banner id="status-banner"></ad-banner>

      <div id="profile-missing" hidden>
        <ad-empty-state icon="not-found.svg" heading="Driver not found" data-i18n-heading="driverProfile.notFoundHeading" message="This driver account does not exist." data-i18n-message="driverProfile.notFoundMessage">
          <a class="btn btn-primary-rounded-outline" href="drivers.html"><i class="fa-solid fa-angle-left people-flip" aria-hidden="true"></i><span data-i18n="driverProfile.backToDrivers">Back to drivers</span></a>
        </ad-empty-state>
      </div>

      <div id="profile-error" hidden>
        <ad-empty-state icon="cloud-connection-off.svg" heading="Couldn't load this record" data-i18n-heading="kitPeople.loadErrorHeading" message="The service is temporarily unavailable." data-i18n-message="state.errorMessage">
          <button class="btn btn-primary-rounded-outline" type="button" id="retry-btn" data-i18n="common.tryAgain">Try again</button>
        </ad-empty-state>
      </div>

      <div id="profile-body" hidden>
        <!-- The kit's 7-card grid, then the portal's payout and history cards -->
        <div class="row g-3 people-grid">
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="status-card" icon="profile-info.svg" section-title="Account status" data-i18n-section-title="driverProfile.statusHeading"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="personal" icon="user-2.svg" section-title="Personal details" data-i18n-section-title="driverProfile.personal"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="vehicle" icon="vehicle.svg" section-title="Vehicle details" data-i18n-section-title="driverProfile.vehicle"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="licence" icon="driving-license.svg" section-title="Licence &amp; registration" data-i18n-section-title="application.licence"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="stats" icon="chart.svg" section-title="Performance" data-i18n-section-title="driverProfile.statsHeading"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="docs-card" icon="upload-file.svg" section-title="Uploaded documents" data-i18n-section-title="application.docsHeading">
              <ad-doc-viewer id="docs"></ad-doc-viewer>
            </ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="photos-card" icon="image.svg" section-title="Vehicle photos" data-i18n-section-title="kitPeople.vehiclePhotos">
              <ad-doc-viewer id="photos"></ad-doc-viewer>
            </ad-detail-section>
          </div>

          <!-- 2026-10-14 spec §2 — payout method; an admin edit is a maker-checker request -->
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="payout" icon="wallet.svg" section-title="Payout method" data-i18n-section-title="driverPayout.heading">
              <div class="people-card-extra" id="payout-extra">
                <div class="people-card-extra" id="payout-notices"></div>
                <p class="small lh-sm mb-0" id="payout-hint" data-i18n="driverPayout.editHint">
                  An edit made here needs another admin's approval. The driver's own change in the app applies immediately.
                </p>
                <div>
                  <button class="btn btn-primary-outline" type="button" id="payout-edit-btn">
                    <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i><span data-i18n="driverPayout.editBtn">Edit payout method</span>
                  </button>
                </div>
              </div>
            </ad-detail-section>
          </div>

          <!-- §3 — where her earnings stand in the payout cycle -->
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="payout-position" icon="deposit-wallet.svg" section-title="Payout position" data-i18n-section-title="driverPayout.positionHeading">
              <div class="people-card-extra">
                <p class="small lh-sm mb-0" id="payout-position-hint"></p>
                <div>
                  <a class="btn btn-primary-outline" id="ledger-link" href="driver-balance-details.html">
                    <span data-i18n="kitPeople.openLedger">Open her ledger</span><i class="fa-solid fa-arrow-right people-flip" aria-hidden="true"></i>
                  </a>
                </div>
              </div>
            </ad-detail-section>
          </div>

          <!-- Decision history: shown for pending, rejected and suspended (#1666 S2/S3) -->
          <div class="col-lg-6 col-xl-4" id="history-section" hidden>
            <ad-detail-section icon="timeline.svg" section-title="Decision history" data-i18n-section-title="driverProfile.historyHeading">
              <ad-timeline id="history"></ad-timeline>
            </ad-detail-section>
          </div>
        </div>

        <!-- #1666 S5 — completed trips, 10 rows/page -->
        <div class="standard-card light-medium-bg mt-3">
          <div class="card-header mb-3">
            <div class="card-title">
              <img class="icon" src="vendor/icons/route.svg" alt="" aria-hidden="true" />
              <h4 id="trips-heading" data-i18n="driverProfile.tripsHeading">Completed trips</h4>
            </div>
          </div>
          <div class="card-body">
            <ad-data-table id="trips-table" aria-labelledby="trips-heading"></ad-data-table>
          </div>
        </div>

        <!-- #1742 suspend / #1743 reinstate — the kit's bottom action row -->
        <div class="d-flex flex-wrap align-items-center gap-3 my-3" id="account-actions">
          <button class="btn btn-danger d-flex" type="button" id="suspend-btn" hidden>
            <i class="fa-solid fa-stop" aria-hidden="true"></i><span data-i18n="driverProfile.suspendBtn">Suspend driver</span>
          </button>
          <button class="btn btn-success d-flex" type="button" id="reinstate-btn" hidden>
            <i class="fa-solid fa-play" aria-hidden="true"></i><span data-i18n="driverProfile.reinstateBtn">Reinstate driver</span>
          </button>
          <p class="small lh-sm mb-0 people-action-hint" id="action-hint"></p>
        </div>
      </div>
    </ad-shell>

    <script type="module" src="scripts/driver-profile.js"></script>
  </body>
</html>
