<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Driver earnings</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="reconciliation"
      page-title-key="reconciliation.title"
      breadcrumb-keys="nav.reporting > nav.reconciliation"
      screen-styles="styles/list.css, styles/pricing.css, styles/reconciliation.css"
    >
      <!-- Kit reconciliation: driver search + date range straight under the title -->
      <ad-filter-bar id="recon-filters"></ad-filter-bar>

      <!-- #1833 S2 — a driver is required before a report can be generated -->
      <div id="no-driver" class="mt-3">
        <ad-empty-state
          icon="⇌"
          heading="Select a driver" data-i18n-heading="reconciliation.emptyHeading"
          message="Choose a driver above to generate her earnings and settlement report."
          data-i18n-message="reconciliation.emptyMessage"
        ></ad-empty-state>
      </div>

      <div id="report" hidden>
        <!-- Period totals. The balance for the period is in the balance card (#5668). -->
        <div class="ad-stats recon__kpis mt-3" id="report-cards">
          <ad-stat-card id="card-trips" tone="primary" icon="trips.svg" label="Completed trips" data-i18n-label="reports.cardTrips" value="—"></ad-stat-card>
          <ad-stat-card id="card-gross" tone="blue" icon="prices.svg" label="Gross fares" data-i18n-label="reports.cardGross" value="—"></ad-stat-card>
          <ad-stat-card id="card-commission" tone="warning" icon="discount.svg" label="Commission deducted" data-i18n-label="reconciliation.cardCommission" value="—"></ad-stat-card>
          <ad-stat-card id="card-net" tone="success" icon="money.svg" label="Net earnings" data-i18n-label="reconciliation.cardNet" value="—"></ad-stat-card>
        </div>

        <section class="mt-4" aria-labelledby="rows-heading">
          <div class="section-title row gy-3 mb-3">
            <div class="title col-auto">
              <h4 class="text-nowrap" id="rows-heading" data-i18n="reconciliation.rowsHeading">Per-trip breakdown</h4>
            </div>
            <div class="end-side col-auto ms-auto">
              <!-- Settlement, payouts and the full ledger live on the driver's balance page -->
              <a class="btn btn-primary d-flex gap-2 align-items-center" id="settle-link" href="balances.html">
                <span data-i18n="kitPricing.openDriverBalance">Open driver balance</span>
                <i class="fa-solid fa-arrow-right" id="settle-link-icon" aria-hidden="true"></i>
              </a>
            </div>
          </div>
          <ad-data-table id="trip-table"></ad-data-table>
        </section>

        <div class="row g-3 mt-1">
          <!-- Who holds the fare decides what a trip means for her balance (spec §1). -->
          <div class="col-lg-12 col-xl-6">
            <section class="standard-card-theme2 white-bg h-100" aria-labelledby="custody-heading">
              <div class="card-header">
                <div class="card-title">
                  <h5 id="custody-heading" data-i18n="kitPricing.custodyHeading">Who holds the fare</h5>
                </div>
                <div class="icon"><img src="vendor/icons/wallet.svg" alt="" /></div>
              </div>
              <div class="card-body">
                <div class="list-multi-column no-border p-0" id="custody-rows"></div>
              </div>
            </section>
          </div>
          <!-- Her balance for the period, from the ledger: opening + movements = closing. -->
          <div class="col-lg-12 col-xl-6">
            <section class="standard-card-theme2 white-bg h-100" aria-labelledby="balance-heading">
              <div class="card-header">
                <div class="card-title">
                  <h5 id="balance-heading" data-i18n="kitPricing.balanceHeading">Balance for the period</h5>
                </div>
                <div class="icon"><img src="vendor/icons/balance.svg" alt="" /></div>
              </div>
              <div class="card-body">
                <div class="list-multi-column no-border p-0" id="balance-rows"></div>
                <p class="small mt-2 mb-0" id="balance-note"></p>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div class="ad-form-error mt-3" id="recon-error" role="alert"></div>
    </ad-shell>

    <script type="module" src="scripts/reconciliation.js"></script>
  </body>
</html>
