<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Driver application</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="driver-applications"
      page-title-key="application.title"
      breadcrumb-keys="nav.driverApplications|driver-applications.html > application.crumb"
      back="driver-applications.html"
      screen-styles="styles/detail.css"
    >
      <!-- #1658 full application · #1659 approve · #1660 reject with reason -->
      <div id="app-missing" hidden>
        <ad-empty-state
          icon="⚠"
          heading="Application not found" data-i18n-heading="application.notFoundHeading"
          message="This application no longer exists, or it has already been reviewed." data-i18n-message="application.notFoundMessage"
        >
          <a class="btn btn-primary-outline btn--sm" href="driver-applications.html" data-i18n="application.backToQueue">
            Back to the queue
          </a>
        </ad-empty-state>
      </div>

      <div id="app-body" hidden>
        <div class="ad-split">
          <div class="ad-stack">
            <ad-detail-section id="personal" icon="user-2.svg" section-title="Personal details" data-i18n-section-title="driverProfile.personal"></ad-detail-section>
            <ad-detail-section id="vehicle" icon="vehicle.svg" section-title="Vehicle details" data-i18n-section-title="driverProfile.vehicle"></ad-detail-section>
            <ad-detail-section id="licence" icon="driving-license.svg" section-title="Licence &amp; registration" data-i18n-section-title="application.licence"></ad-detail-section>

            <section class="ad-section" aria-labelledby="docs-heading">
              <div class="ad-section__header">
                <div>
                  <h2 class="ad-section__title" id="docs-heading" data-i18n="application.docsHeading">Uploaded documents</h2>
                  <p class="ad-section__hint" data-i18n="application.docsHint">
                    Click a document to open it larger. Images here are placeholders — the
                    mockup never carries real ID scans.
                  </p>
                </div>
              </div>
              <div class="ad-section__body">
                <ad-doc-viewer id="docs"></ad-doc-viewer>
              </div>
            </section>

            <section class="ad-section" aria-labelledby="photos-heading">
              <div class="ad-section__header">
                <h2 class="ad-section__title" id="photos-heading" data-i18n="application.photosHeading">Vehicle &amp; profile photo</h2>
              </div>
              <div class="ad-section__body">
                <ad-doc-viewer id="photos"></ad-doc-viewer>
              </div>
            </section>
          </div>

          <aside class="ad-split__aside">
            <section class="ad-section" aria-labelledby="decision-heading">
              <div class="ad-section__header">
                <h2 class="ad-section__title" id="decision-heading" data-i18n="application.decisionHeading">Decision</h2>
              </div>
              <div class="ad-section__body ad-stack">
                <p class="ad-section__hint" id="decision-hint" data-i18n="application.decisionHint">
                  Approving lets this driver go online. Rejecting requires a reason, which the
                  driver is notified with.
                </p>
                <button class="btn btn-primary btn--full" type="button" id="approve-btn" data-i18n="application.approveBtn">
                  Approve application
                </button>
                <button class="btn btn-danger btn--full" type="button" id="reject-btn" data-i18n="application.rejectBtn">
                  Reject application
                </button>
              </div>
            </section>

            <ad-detail-section id="summary" icon="application-status.svg" section-title="Submission" data-i18n-section-title="application.summary"></ad-detail-section>
          </aside>
        </div>
      </div>

      <ad-form-modal id="decision-modal"></ad-form-modal>
    </ad-shell>

    <script type="module" src="scripts/driver-application.js"></script>
  </body>
</html>
