<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Driver application</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="driver-applications"
      page-title-key="application.title"
      breadcrumb-keys="nav.driverApplications|driver-applications.html > application.crumb"
      back="driver-applications.html"
      screen-styles="styles/detail.css, styles/driver-application.css"
    >
      <!-- #1658 full application · #1659 approve · #1660 reject with reason -->
      <!-- Kit model: driver-application-view.html (+ -not-found) v22-09 -->
      <div id="app-missing" hidden>
        <ad-empty-state
          icon="not-found.svg"
          heading="Application not found" data-i18n-heading="application.notFoundHeading"
          message="This application no longer exists, or it has already been reviewed." data-i18n-message="application.notFoundMessage"
        >
          <a class="btn btn-primary-rounded-outline" href="driver-applications.html"><i class="fa-solid fa-angle-left people-flip" aria-hidden="true"></i><span data-i18n="application.backToQueue">Back to the queue</span></a>
        </ad-empty-state>
      </div>

      <div id="app-error" hidden>
        <ad-empty-state icon="cloud-connection-off.svg" heading="Couldn't load this record" data-i18n-heading="kitPeople.loadErrorHeading" message="The service is temporarily unavailable." data-i18n-message="state.errorMessage">
          <button class="btn btn-primary-rounded-outline" type="button" id="retry-btn" data-i18n="common.tryAgain">Try again</button>
        </ad-empty-state>
      </div>

      <div id="app-body" hidden>
        <div class="row g-3 people-grid">
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="personal" icon="user-2.svg" section-title="Personal details" data-i18n-section-title="driverProfile.personal"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="vehicle" icon="vehicle.svg" section-title="Vehicle details" data-i18n-section-title="driverProfile.vehicle"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="licence" icon="driving-license.svg" section-title="Licence &amp; registration" data-i18n-section-title="application.licence"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="summary" icon="submission.svg" section-title="Submission &amp; status" data-i18n-section-title="kitPeople.submissionStatus"></ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="docs-card" icon="upload-file.svg" section-title="Uploaded documents" data-i18n-section-title="application.docsHeading">
              <ad-doc-viewer id="docs"></ad-doc-viewer>
            </ad-detail-section>
          </div>
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="photos-card" icon="image.svg" section-title="Vehicle photos" data-i18n-section-title="kitPeople.vehiclePhotos">
              <ad-doc-viewer id="photos"></ad-doc-viewer>
            </ad-detail-section>
          </div>

          <!-- 2026-10-14 spec §2 — payout method is the last onboarding step; read-only here -->
          <div class="col-lg-6 col-xl-4">
            <ad-detail-section id="payout" icon="wallet.svg" section-title="Payout method" data-i18n-section-title="driverPayout.heading"></ad-detail-section>
          </div>

          <!-- Decisions already made on this application, when there are any -->
          <div class="col-lg-6 col-xl-4" id="history-section" hidden>
            <ad-detail-section icon="timeline.svg" section-title="Decision history" data-i18n-section-title="driverProfile.historyHeading">
              <ad-timeline id="history"></ad-timeline>
            </ad-detail-section>
          </div>
        </div>

        <!-- The kit's bottom decision row -->
        <div class="d-flex flex-wrap align-items-center gap-3 my-3" id="decision-actions">
          <button class="btn btn-success d-flex" type="button" id="approve-btn">
            <i class="fa-solid fa-check" aria-hidden="true"></i><span data-i18n="application.approveBtn">Approve application</span>
          </button>
          <button class="btn btn-danger d-flex" type="button" id="reject-btn">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i><span data-i18n="application.rejectBtn">Reject application</span>
          </button>
          <p class="small lh-sm mb-0 people-action-hint" id="decision-hint" data-i18n="application.decisionHint">
            Approving lets this driver go online. Rejecting requires a reason, which the driver is notified with.
          </p>
        </div>
      </div>
    </ad-shell>

    <script type="module" src="scripts/driver-application.js"></script>
  </body>
</html>
