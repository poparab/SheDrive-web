<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Two-factor authentication</title>
    <meta name="robots" content="noindex" />
  </head>

  <body class="admin-auth" data-step="2fa">
    <div class="container-fluid container-md-width">
      <div class="row">
        <div class="col-xl-6 col-xxl-5 login-start-side">
          <img class="login-logo" src="vendor/img/logo.png" data-i18n-alt="aria.logo" alt="SheDrive" />
          <h2 data-i18n="auth.tfaTitle">Two-factor authentication</h2>
          <p class="mb-4" data-i18n="auth.redirect.twoFactor">Opening the two-factor step of the sign-in screen — the 6-digit authenticator code (#1806).</p>
          <p>
            <a class="primary-link" href="index.html?step=2fa" data-i18n="auth.redirect.continue">
              Continue to the sign-in screen
            </a>
          </p>
        </div>
        <!-- End Col -->

        <div class="d-none d-xl-block col-xl-6 col-xxl-7 login-end-side">
          <img src="vendor/img/login-slogan.png" alt="" />
        </div>
        <!-- End Col -->
      </div>
      <!-- End Row -->
    </div>
    <!-- End Container -->

    <script type="module" src="scripts/auth-redirect.js"></script>
  </body>
</html>
