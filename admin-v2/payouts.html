<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Payouts</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="payouts"
      page-title-key="payouts.title"
      breadcrumb-keys="nav.money > nav.payouts"
      screen-styles="styles/list.css, styles/payouts.css"
    >
      <!-- "Generate payout batch" is added to the title row's end side by scripts/payouts.js. -->
      <div class="alert info payouts-lead">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <p data-i18n="payouts.lead">
          Trip earnings and cancellation-fee credits become due 7 calendar days after they happen.
          On working days a Financial officer or lead generates a payout batch; a Financial lead
          approves it before the bank file can be exported.
        </p>
      </div>

      <div class="ad-stats" id="payouts-stats">
        <ad-stat-card id="card-due" label="Due now" data-i18n-label="payouts.kpiDue" value="—" tone="primary" icon="wallet-plus.svg"></ad-stat-card>
        <ad-stat-card id="card-open" label="In open batches" data-i18n-label="payouts.kpiOpen" value="—" tone="blue" icon="wallet-minus.svg"></ad-stat-card>
        <ad-stat-card id="card-paid" label="Paid this month" data-i18n-label="payouts.kpiPaid" value="—" tone="success" icon="checked-2.svg"></ad-stat-card>
      </div>

      <ad-filter-bar id="batch-filters"></ad-filter-bar>
      <ad-data-table id="batches-table"></ad-data-table>
    </ad-shell>
    <script type="module" src="scripts/payouts.js"></script>
  </body>
</html>
