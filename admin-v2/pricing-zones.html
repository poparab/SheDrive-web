<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Pricing & zones</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  </head>

  <body>
    <ad-shell
      active="pricing-zones"
      page-title-key="zones.title"
      breadcrumb-keys="nav.money > nav.pricingZones"
      screen-styles="styles/list.css, styles/pricing.css"
      mapbox
    >
      <!-- Kit service-zone: "Create Zone" sits in the title row's end side;
           pricing-zones.js moves it into #ad-page-actions once the shell renders. -->
      <button class="btn btn-success d-flex gap-2 align-items-center" type="button" id="create-zone">
        <img src="vendor/icons/add-location.svg" alt="" />
        <span data-i18n="zones.createZone">Create zone</span>
      </button>

      <!-- Persistent state: inactive zones, or a map that could not load (ad-banner) -->
      <ad-banner id="zones-banner"></ad-banner>

      <!-- #1831 — map overview of every zone, full width at the top -->
      <div class="row mt-2 mb-3 pricing-zones__map" id="zone-map-row">
        <div class="col">
          <ad-map-panel id="zone-map"></ad-map-panel>
          <p class="small pricing__meta mt-2 mb-0" id="map-summary" data-i18n="dashboard.mapArea">Cairo / Giza service area</p>
        </div>
      </div>

      <!-- Draw toolbar, shown only while drawing a boundary (#1756) -->
      <div class="alert info pricing-zones__draw" id="draw-panel" role="region" aria-labelledby="draw-heading" hidden>
        <i class="fa-solid fa-bezier-curve" aria-hidden="true"></i>
        <div class="details">
          <h6 id="draw-heading" data-i18n="zones.drawHeading">Draw the zone boundary</h6>
          <p id="draw-hint" data-i18n="zones.drawHint">
            Click the map to place at least three points. The boundary must not cross itself.
          </p>
          <span class="status-blue-solid" id="draw-count">0 points</span>
          <div class="ad-form-error" id="draw-error" role="alert"></div>
        </div>
        <div class="end-side ms-auto d-flex flex-wrap gap-2">
          <button class="btn btn-success d-inline-flex align-items-center gap-2" type="button" id="draw-finish">
            <i class="fa-solid fa-check" aria-hidden="true"></i><span data-i18n="zones.finishBoundary">Finish boundary</span>
          </button>
          <button class="btn btn-tertiary d-inline-flex align-items-center gap-2" type="button" id="draw-undo">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span data-i18n="zones.undoPoint">Undo point</span>
          </button>
          <button class="btn btn-primary-outline d-inline-flex align-items-center gap-2" type="button" id="draw-cancel">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i><span data-i18n="common.cancel">Cancel</span>
          </button>
        </div>
      </div>

      <!-- 2026-10-14 §1 — rate card changes wait for a second admin -->
      <div class="alert warning" id="zones-pending" role="status" hidden>
        <i class="fa-solid fa-hourglass-half" aria-hidden="true"></i>
        <p id="zones-pending-text"></p>
      </div>

      <!-- #1831 — zone list, 50 rows/page, A→Z -->
      <section class="pricing-zones__list" id="zones-list" aria-label="Zones" data-i18n-aria-label="zones.zonesHeading">
        <ad-filter-bar id="zone-filters"></ad-filter-bar>
        <div class="row mt-2">
          <div class="col">
            <ad-data-table id="zone-table"></ad-data-table>
          </div>
        </div>
      </section>
    </ad-shell>

    <script type="module" src="scripts/pricing-zones.js"></script>
  </body>
</html>
