<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Rider profile</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="riders"
      page-title-key="riderProfile.title"
      breadcrumb-keys="nav.riders|riders.html > riderProfile.crumb"
      back="riders.html"
      screen-styles="styles/detail.css, styles/list.css"
    >
      <div id="profile-missing" hidden>
        <ad-empty-state icon="⚠" heading="Rider not found" data-i18n-heading="riderProfile.notFoundHeading" message="This rider account does not exist." data-i18n-message="riderProfile.notFoundMessage">
          <a class="btn btn-primary-outline btn--sm" href="riders.html" data-i18n="riderProfile.backToRiders">Back to riders</a>
        </ad-empty-state>
      </div>

      <div id="profile-body" hidden>
        <div class="ad-split">
          <div class="ad-stack">
            <ad-detail-section id="personal" icon="user-2.svg" section-title="Rider details" data-i18n-section-title="riderProfile.personal"></ad-detail-section>

            <!-- #1662 S6 — trip history, 10 rows/page, read-only -->
            <section class="ad-section" aria-labelledby="trips-heading">
              <div class="ad-section__header">
                <div>
                  <h2 class="ad-section__title" id="trips-heading" data-i18n="riderProfile.tripsHeading">Trip history</h2>
                  <p class="ad-section__hint" data-i18n="riderProfile.tripsHint">
                    Read-only. Trip rows are deliberately not clickable in this phase.
                  </p>
                </div>
              </div>
              <ad-data-table id="trips-table"></ad-data-table>
            </section>
          </div>

          <aside class="ad-split__aside">
            <ad-detail-section id="status-card" icon="profile-info.svg" section-title="Account status" data-i18n-section-title="driverProfile.statusHeading"></ad-detail-section>

            <section class="ad-section" aria-labelledby="actions-heading">
              <div class="ad-section__header">
                <h2 class="ad-section__title" id="actions-heading" data-i18n="riderProfile.actionsHeading">Account actions</h2>
              </div>
              <div class="ad-section__body ad-stack">
                <p class="ad-section__hint" id="action-hint"></p>
                <button class="btn btn-danger btn--full" type="button" id="suspend-btn" hidden data-i18n="riderProfile.suspendBtn">
                  Suspend rider
                </button>
                <button class="btn btn-primary btn--full" type="button" id="reinstate-btn" hidden data-i18n="riderProfile.reinstateBtn">
                  Reinstate rider
                </button>
              </div>
            </section>
          </aside>
        </div>
      </div>

      <ad-form-modal id="action-modal"></ad-form-modal>
    </ad-shell>

    <script type="module" src="scripts/rider-profile.js"></script>
  </body>
</html>
