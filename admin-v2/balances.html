<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Driver balances</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <!--
      Kit v22-09 driver-balances.html: KPI row, filter row, grid with a Ledger
      action per row. The ledger itself is its own page,
      driver-balance-details.html?id=<driverId>.
    -->
    <ad-shell
      active="balances"
      page-title-key="balances.heading"
      breadcrumb-keys="nav.money > nav.balances"
      screen-styles="styles/balances.css"
    >
      <div class="ad-stats balance-kpis">
        <ad-stat-card id="card-owing" tone="success" icon="wallet-minus.svg" label="Debtor drivers" data-i18n-label="kitBalances.kpiDebtors" value="—"></ad-stat-card>
        <ad-stat-card id="card-outstanding" tone="primary" icon="balance.svg" label="Total outstanding" data-i18n-label="kitBalances.kpiOutstanding" value="—"></ad-stat-card>
        <ad-stat-card id="card-owed" tone="warning" icon="wallet-plus.svg" label="Driver payables" data-i18n-label="kitBalances.kpiPayables" value="—"></ad-stat-card>
        <ad-stat-card id="card-blocked" tone="danger" icon="stop-hand.svg" label="Online blocked" data-i18n-label="kitBalances.kpiBlocked" value="—"></ad-stat-card>
      </div>

      <ad-filter-bar id="balance-filters"></ad-filter-bar>
      <ad-data-table id="balance-table"></ad-data-table>
    </ad-shell>
    <script type="module" src="scripts/balances.js"></script>
  </body>
</html>
