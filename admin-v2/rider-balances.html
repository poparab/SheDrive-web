<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Rider balances</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <!--
      Kit v22-09 rider-balances.html: two KPI tiles, the filter row and a grid
      whose Ledger action opens rider-balance-details.html?id=<riderId>.
    -->
    <ad-shell
      active="rider-balances"
      page-title-key="riderBalances.heading"
      breadcrumb-keys="nav.money > nav.riderBalances"
      screen-styles="styles/rider-balances.css"
    >
      <div class="ad-stats rider-balance-kpis">
        <ad-stat-card id="card-outstanding" tone="success" icon="balance.svg" label="Total outstanding" data-i18n-label="kitBalances.kpiRiderOutstanding" value="—"></ad-stat-card>
        <ad-stat-card id="card-owing" tone="danger" icon="wallet-minus.svg" label="Riders with fees due" data-i18n-label="kitBalances.kpiRidersDue" value="—"></ad-stat-card>
      </div>

      <ad-filter-bar id="rider-balance-filters"></ad-filter-bar>
      <ad-data-table id="rider-balance-table"></ad-data-table>
    </ad-shell>
    <script type="module" src="scripts/rider-balances.js"></script>
  </body>
</html>
