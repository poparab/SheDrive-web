<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Payout batch</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="payouts"
      page-title-key="payoutBatch.title"
      breadcrumb-keys="nav.money > nav.payouts|payouts.html > payoutBatch.crumb"
      back="payouts.html"
      screen-styles="styles/list.css, styles/payout-batch.css, styles/approval-review.css"
    >
      <div id="batch-missing" hidden>
        <ad-empty-state
          icon="not-found.svg"
          heading="Payout batch not found"
          data-i18n-heading="payoutBatch.notFoundHeading"
          message="This payout batch does not exist."
          data-i18n-message="payoutBatch.notFoundMessage"
        >
          <a class="btn btn-primary-rounded-outline" href="payouts.html" data-i18n="payoutBatch.backToPayouts">Back to payouts</a>
        </ad-empty-state>
      </div>

      <div id="batch-error" hidden>
        <ad-empty-state
          icon="cloud-connection-off.svg"
          tone="danger"
          heading="Could not load the batch"
          data-i18n-heading="payoutBatch.errorHeading"
          message=""
          id="batch-error-state"
        >
          <button type="button" class="btn btn-primary-rounded-outline" id="batch-retry" data-i18n="payoutBatch.retry">Try again</button>
        </ad-empty-state>
      </div>

      <div id="batch-loading" class="batch-loading">
        <span class="spinner"></span>
      </div>

      <div id="batch-body" hidden>
        <!-- Kit v22-10 payout-batch: summary + state timeline side by side, then the
             batch contents, then the next step (result file / approval) full width. -->
        <div class="row row-cols-1 row-cols-lg-2 g-3">
          <div class="col">
            <div class="standard-card-theme2 white-bg batch-card" id="batch-summary">
              <div class="card-header">
                <div class="card-title">
                  <h5 data-i18n="kitFinance.pbSummaryTitle">Batch summary</h5>
                  <span class="ad-ltr" id="batch-ref"></span>
                </div>
                <div class="icon"><img src="vendor/icons/layers.svg" alt="" /></div>
              </div>
              <div class="card-body pb-0" id="batch-summary-body"></div>
              <div class="card-footer d-flex flex-column align-items-end batch-again" id="batch-summary-footer" hidden></div>
            </div>
          </div>

          <div class="col">
            <div class="standard-card-theme2 white-bg batch-card" id="batch-progress">
              <div class="card-header">
                <div class="card-title">
                  <h5 data-i18n="kitFinance.pbTimelineTitle">State timeline</h5>
                  <span></span>
                </div>
                <div class="icon"><img src="vendor/icons/timeline.svg" alt="" /></div>
              </div>
              <div class="card-body pb-0" id="batch-timeline-body"></div>
            </div>
          </div>
        </div>

        <!-- Full width: the lines table (kit "Batch contents" card). -->
        <div class="standard-card light-medium-bg batch-lines" aria-labelledby="lines-heading">
          <div class="card-header mb-3">
            <div class="card-title">
              <img class="icon" src="vendor/icons/layers.svg" alt="" />
              <h4 id="lines-heading" data-i18n="payoutBatch.contentsHeading">Batch contents</h4>
            </div>
          </div>
          <div class="card-body">
            <ad-data-table id="lines-table"></ad-data-table>
          </div>
        </div>

        <!-- Next step: the kit's "Import result file" card, full width. -->
        <div class="standard-card-theme2 white-bg batch-next" id="batch-actions">
          <div class="card-header">
            <div class="card-title">
              <h4 data-i18n="payoutBatch.actionsHeading">Next step</h4>
              <span></span>
            </div>
            <div class="icon"><img src="vendor/icons/upload-file.svg" alt="" /></div>
          </div>
          <div class="card-body" id="batch-actions-body"></div>
        </div>
      </div>
    </ad-shell>

    <script type="module" src="scripts/payout-batch.js"></script>
  </body>
</html>
