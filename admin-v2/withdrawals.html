<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Withdrawal requests</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="withdrawals"
      page-title-key="withdrawals.heading"
      breadcrumb-keys="nav.money > nav.withdrawals"
      screen-styles="styles/detail.css, styles/balances.css"
    >
      <section class="ad-section">
        <p class="ad-section__hint" data-i18n="withdrawals.lead">
          A request reserves against the driver's available balance — no money has moved.
          Approve accepts it, Mark paid posts the withdrawal to her ledger, and Reject
          releases the reservation and returns your reason to her app.
        </p>
      </section>

      <div class="ad-stats">
        <ad-stat-card id="card-pending" label="Pending review" data-i18n-label="withdrawals.cardPending" value="—"></ad-stat-card>
        <ad-stat-card id="card-approved" label="Awaiting payment" data-i18n-label="withdrawals.cardApproved" value="—"></ad-stat-card>
        <ad-stat-card id="card-reserved" label="Total reserved" data-i18n-label="withdrawals.cardReserved" value="—"></ad-stat-card>
        <ad-stat-card id="card-paid" label="Paid this period" data-i18n-label="withdrawals.cardPaid" value="—"></ad-stat-card>
      </div>

      <ad-filter-bar id="withdrawal-filters"></ad-filter-bar>
      <ad-data-table id="withdrawal-table"></ad-data-table>

      <ad-form-modal id="withdrawal-modal"></ad-form-modal>
    </ad-shell>
    <script type="module" src="scripts/withdrawals.js"></script>
  </body>
</html>
