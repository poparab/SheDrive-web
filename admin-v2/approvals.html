<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Approvals</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="approvals"
      page-title-key="approvals.pageTitle"
      breadcrumb-keys="nav.money > nav.approvals"
      screen-styles="styles/list.css, styles/approvals.css"
    >
      <!-- Demo only (spec §7): act as a second admin to show the checker side. -->
      <div class="alert warning apr-demo" id="approvals-demo" role="region" aria-label="Demo switch" data-i18n-aria-label="approvals.demoBadge"></div>

      <div class="alert info apr-hint">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <p data-i18n="approvals.hint">Every finance action waits here until a different admin approves or rejects it.</p>
      </div>

      <!-- Kit KPI row -->
      <div
        class="ad-stats"
        id="approvals-stats"
        aria-label="Approvals summary"
        data-i18n-aria-label="approvals.statsLabel"
      ></div>

      <ad-filter-bar id="approvals-filters"></ad-filter-bar>
      <ad-data-table id="approvals-table"></ad-data-table>
    </ad-shell>

    <script type="module" src="scripts/approvals.js"></script>
  </body>
</html>
