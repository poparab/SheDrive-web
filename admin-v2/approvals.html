<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Approvals</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="approvals"
      page-title-key="approvals.pageTitle"
      breadcrumb-keys="nav.money > nav.approvals"
      screen-styles="styles/list.css, styles/approvals.css"
    >
      <!-- Demo only (spec §7): act as a second admin to show the checker side. -->
      <div class="apr-demo" id="approvals-demo" role="region" aria-label="Demo switch" data-i18n-aria-label="approvals.demoBadge"></div>

      <!-- Kit KPI row -->
      <div
        class="ad-stats"
        id="approvals-stats"
        aria-label="Approvals summary"
        data-i18n-aria-label="approvals.statsLabel"
      ></div>

      <section class="ad-section" aria-labelledby="approvals-heading">
        <div class="ad-section__header">
          <div>
            <h2 class="ad-section__title" id="approvals-heading" data-i18n="approvals.heading">Request queue</h2>
            <p class="ad-section__hint" data-i18n="approvals.hint">
              Every finance action waits here until a different admin approves or rejects it.
            </p>
          </div>
        </div>

        <ad-tabs id="approvals-tabs"></ad-tabs>
        <ad-filter-bar id="approvals-filters"></ad-filter-bar>
        <ad-data-table id="approvals-table"></ad-data-table>
      </section>
    </ad-shell>

    <script type="module" src="scripts/approvals.js"></script>
  </body>
</html>
