<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheDrive Admin — Approvals</title>
    <meta name="robots" content="noindex" />
    <script type="module" src="components/ad-shell.js"></script>
  </head>

  <body>
    <ad-shell
      active="approvals"
      page-title-key="approvals.pageTitle"
      breadcrumb-keys="nav.money > nav.approvals"
      screen-styles="styles/list.css, styles/approval-review.css, styles/approvals.css"
    >
      <div class="alert info apr-hint">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <p data-i18n="approvalRoles.hint">Every finance request waits here until a Financial lead approves or rejects it.</p>
      </div>

      <!-- #6212 — a Financial officer's queue lists only her own requests, read-only. -->
      <div class="alert warning apr-hint" id="approvals-officer-note" hidden>
        <i class="fa-solid fa-eye" aria-hidden="true"></i>
        <p data-i18n="approvalRoles.officerQueueNote">You see the requests you made. A Financial lead approves or rejects them.</p>
      </div>

      <!-- Kit KPI row -->
      <div
        class="ad-stats"
        id="approvals-stats"
        aria-label="Approvals summary"
        data-i18n-aria-label="approvals.statsLabel"
      ></div>

      <ad-filter-bar id="approvals-filters"></ad-filter-bar>
      <ad-data-table id="approvals-table"></ad-data-table>
    </ad-shell>

    <script type="module" src="scripts/approvals.js"></script>
  </body>
</html>
